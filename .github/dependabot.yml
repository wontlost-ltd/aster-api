# Dependabot configuration for aster-api.
#
# Two ecosystems active:
#   - gradle    weekly minor/patch (Quarkus, Drizzle equivalents,
#               Hibernate, Vert.x, etc.)
#   - github-actions  weekly
#
# Quarkus + GraalVM major bumps are NOT auto-PR'd — those land
# manually after running the perf-regression suite (see
# docs/perf/README.md). The ignore block below catches them.

version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Australia/Melbourne
    open-pull-requests-limit: 6
    labels:
      - dependencies
      - gradle
    commit-message:
      prefix: "chore(deps)"
      include: scope

    ignore:
      # Quarkus + Truffle/GraalVM majors land manually — they tend
      # to break Polyglot Context lifecycle and the eval-source path
      # we measured carefully in the May load tests.
      - dependency-name: "io.quarkus:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.graalvm.polyglot:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "io.quarkus.platform:*"
        update-types: ["version-update:semver-major"]
      # aster-lang-core / aster-lang-truffle are owned by us.
      - dependency-name: "io.aster:*"
      - dependency-name: "cloud.aster-lang:*"

    groups:
      quarkus:
        patterns:
          - "io.quarkus:*"
          - "io.quarkus.platform:*"
        update-types: ["minor", "patch"]
      # ★GraalVM 全组件必须 lockstep（issue #193，实测）。
      #
      #   #191 单独升 polyglot 时 CI 真失败：
      #     NoClassDefFoundError → ExceptionInInitializerError at Engine.java:559
      #     （StandaloneReplayExecutorTest / RunnerMainIntegrationTest 4 例）
      #   而 #188/#189/#190/#192 单独跑却全绿 —— **逐个合看起来都绿、合到最后一定炸**，
      #   这是最危险的形态。Engine.java:559 是 GraalVM 组件版本混搭的典型症状。
      #
      #   归一组后 Dependabot 出**一个** PR 同时升全部组件，杜绝混搭。
      #   与本文件已有的 quarkus group（plugin + bom 必须同版本）同理。
      #
      #   ★truffle-compiler 曾被 Dependabot 漏掉（#188-#192 五个 PR 里没有它），
      #     导致 api 内部一度 25.0.3/25.0.4 混用。这里显式列出全部坐标前缀。
      graalvm:
        patterns:
          - "org.graalvm.polyglot:*"
          - "org.graalvm.sdk:*"
          - "org.graalvm.truffle:*"
          - "org.graalvm.compiler:*"
          - "org.graalvm.buildtools:*"
        update-types: ["minor", "patch"]
      hibernate:
        patterns:
          - "org.hibernate:*"
          - "io.agroal:*"
        update-types: ["minor", "patch"]
      vertx:
        patterns:
          - "io.vertx:*"
          - "io.smallrye:*"
        update-types: ["minor", "patch"]
      test-tooling:
        dependency-type: development
        patterns:
          - "org.junit*:*"
          - "io.rest-assured:*"
          - "org.mockito:*"
          - "org.assertj:*"
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Australia/Melbourne
    open-pull-requests-limit: 4
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci(deps)"
      include: scope
    groups:
      actions-core:
        patterns:
          - "actions/*"
      docker-actions:
        patterns:
          - "docker/*"
