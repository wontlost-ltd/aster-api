name: Setup Aster build
description: >-
  检出全部 aster-lang 生态兄弟仓（composite includeBuild + 版本目录源），装好 JDK，
  并把共享版本目录发布到 Maven Local。封装 ci/deploy/nightly/perf 四个 workflow 里
  逐字重复的构建准备段——加/删一个语言包仓只需改这一处。

# 前提（重要）：调用方必须**先**用 actions/checkout 把 aster-api 检出到 ./aster-api，
# 再 `uses: ./aster-api/.github/actions/setup-aster-build`。因为 local composite action
# 的文件本身就在 aster-api 仓内——不先检出主仓，这个 action 路径还不存在（鸡生蛋）。
# 故本 action 只负责检出 7 个**兄弟**仓（与 ./aster-api 平级），aster-api 自身由调用方检出。
#
# 说明：本 action 只做「构建准备」——检出兄弟仓 + JDK + 发布版本目录。它**不**起 DB/Redis
# service（那是各 job 的 services: 块职责，与运行时环境耦合），也**不**跑测试或构建
# aster-api 本体（由调用方决定跑 test / integrationTest / build 的哪一步）。

inputs:
  cross-repo-token:
    description: >-
      检出私有兄弟仓用的 token。传 secrets.CROSS_REPO_TOKEN；缺省回退到 github.token
      （同 org 公开仓或放宽权限时可用）。
    required: false
    default: ""
  require-cross-repo-token:
    description: >-
      是否强制要求 cross-repo-token 非空（fail-closed）。生产/部署链路（deploy/nightly/
      perf）应设 "true"：兄弟仓是受控私有源，凭据缺失时必须**显式失败**而非静默回退到
      github.token——否则会把"必须用受控凭据取依赖源码"的策略降级成"能拉到就行"（Codex
      交叉审 Medium）。CI（PR/公开场景）可留 "false" 用 fallback。
    required: false
    default: "false"
  gradle-cache-group:
    description: >-
      Gradle 依赖缓存的分组名（#563）。解析**同一依赖配置**的 job 填同一个组名，共用一条缓存；
      留空则按 workflow + job 单独一条。不同配置的 job 不得同组：先写入的 job 若只解析了子集，
      同组其他 job 会精确命中这条残缺缓存、每次再去 Maven Central 补下载。
    required: false
    default: ""
  java-version:
    description: JDK 主版本
    required: false
    default: "25"
  java-distribution:
    description: JDK 发行版
    required: false
    default: temurin
  publish-catalog:
    description: >-
      是否把 aster-lang-platform 版本目录发布到 Maven Local。settings.gradle 在评估阶段
      解析 catalog（composite includeBuild 无法替换它），故除非调用方另行准备，否则应保持
      true。
    required: false
    default: "true"
  sibling-ref:
    description: >-
      兄弟仓的 checkout ref（issue #247）。默认值必须与 settings.gradle 里
      aster-lang-platform 的版本 pin 对应——生态 lockstep 发版，七个仓共用同一个
      版本号与 tag 名。

      ★为什么必须钉住：settings.gradle 对 core/runtime/truffle/validation/hi 做了
      composite includeBuild + dependencySubstitution，而本 action 会 checkout 兄弟仓
      **源码**。此前不指定 ref → 取各兄弟仓 default branch(main)，于是 CI 测的是
      **移动目标**，而生产部署用的是已发布制品——两者不是同一个组合。
      后果：api 的绿灯不能证明它与 pin 的那个版本兼容；反过来，兄弟仓 main 一有
      破坏性改动，api 会在自己没改任何东西的情况下变红。

      跨仓联调（需要兄弟仓未发版的改动）时，调用方显式传 main 即可，
      这让"用移动目标"从**默认行为**变成**显式选择**。
    required: false
    default: "v1.0.56"

runs:
  using: composite
  steps:
    # fail-closed 前置检查：生产/部署链路（require-cross-repo-token=true）必须提供受控
    # 凭据，缺失时立即失败，而不是静默回退到 github.token 去拉私有兄弟仓源码（Codex 审 Medium）。
    - name: Require cross-repo token (fail-closed)
      if: ${{ inputs.require-cross-repo-token == 'true' && inputs.cross-repo-token == '' }}
      shell: bash
      run: |
        echo "::error::require-cross-repo-token=true 但 cross-repo-token 为空。"
        echo "生产/部署链路必须提供受控的 CROSS_REPO_TOKEN 来检出私有兄弟仓，拒绝回退到 github.token。"
        exit 1

    # 共享版本目录（aster-lang-platform，ADR 0012）：settings.gradle 依赖它，且 catalog
    # 无法通过 composite includeBuild 替换（settings 评估阶段解析）→ 必须先发布到 Maven Local。
    - uses: actions/checkout@v7
      with:
        repository: aster-cloud/aster-lang-platform
        path: aster-lang-platform
        ref: ${{ inputs.sibling-ref }}
        token: ${{ inputs.cross-repo-token || github.token }}
        # 不把凭据写进 .git/config：checkout 默认会持久化 token 供后续 git 操作，
        # 于是本 job 里任何后续步骤（含 Gradle 构建脚本）都能读到这个跨仓 PAT。
        # 本 action 只需要一次性拉源码，不需要后续 git 操作 → 关掉持久化。
        persist-credentials: false

    # composite includeBuild 引用的兄弟仓（见 aster-api/settings.gradle）：源码参与构建，
    # 替换掉 cloud.aster-lang:* 的已发布制品。加/删仓在此一处维护即可。
    - uses: actions/checkout@v7
      with:
        repository: aster-cloud/aster-lang-core
        path: aster-lang-core
        ref: ${{ inputs.sibling-ref }}
        token: ${{ inputs.cross-repo-token || github.token }}
        # 不把凭据写进 .git/config：checkout 默认会持久化 token 供后续 git 操作，
        # 于是本 job 里任何后续步骤（含 Gradle 构建脚本）都能读到这个跨仓 PAT。
        # 本 action 只需要一次性拉源码，不需要后续 git 操作 → 关掉持久化。
        persist-credentials: false

    - uses: actions/checkout@v7
      with:
        repository: aster-cloud/aster-lang-runtime
        path: aster-lang-runtime
        ref: ${{ inputs.sibling-ref }}
        token: ${{ inputs.cross-repo-token || github.token }}
        # 不把凭据写进 .git/config：checkout 默认会持久化 token 供后续 git 操作，
        # 于是本 job 里任何后续步骤（含 Gradle 构建脚本）都能读到这个跨仓 PAT。
        # 本 action 只需要一次性拉源码，不需要后续 git 操作 → 关掉持久化。
        persist-credentials: false

    - uses: actions/checkout@v7
      with:
        repository: aster-cloud/aster-lang-truffle
        path: aster-lang-truffle
        ref: ${{ inputs.sibling-ref }}
        token: ${{ inputs.cross-repo-token || github.token }}
        # 不把凭据写进 .git/config：checkout 默认会持久化 token 供后续 git 操作，
        # 于是本 job 里任何后续步骤（含 Gradle 构建脚本）都能读到这个跨仓 PAT。
        # 本 action 只需要一次性拉源码，不需要后续 git 操作 → 关掉持久化。
        persist-credentials: false

    - uses: actions/checkout@v7
      with:
        repository: aster-cloud/aster-lang-validation
        path: aster-lang-validation
        ref: ${{ inputs.sibling-ref }}
        token: ${{ inputs.cross-repo-token || github.token }}
        # 不把凭据写进 .git/config：checkout 默认会持久化 token 供后续 git 操作，
        # 于是本 job 里任何后续步骤（含 Gradle 构建脚本）都能读到这个跨仓 PAT。
        # 本 action 只需要一次性拉源码，不需要后续 git 操作 → 关掉持久化。
        persist-credentials: false

    # en/zh/de lexicon SPI 包源：aster-lang-locales（多模块，新坐标
    # aster-lang-locales-{en,zh,de}）。旧独立 en/zh/de 仓已归档。
    - uses: actions/checkout@v7
      with:
        repository: aster-cloud/aster-lang-locales
        path: aster-lang-locales
        ref: ${{ inputs.sibling-ref }}
        token: ${{ inputs.cross-repo-token || github.token }}
        # 不把凭据写进 .git/config：checkout 默认会持久化 token 供后续 git 操作，
        # 于是本 job 里任何后续步骤（含 Gradle 构建脚本）都能读到这个跨仓 PAT。
        # 本 action 只需要一次性拉源码，不需要后续 git 操作 → 关掉持久化。
        persist-credentials: false

    # Hindi (hi-IN) 独立 SPI 包（从 core builtins 拆出），aster-api 经 composite
    # includeBuild + runtimeOnly asterLibs.hi 依赖，故其源码必须在场。
    - uses: actions/checkout@v7
      with:
        repository: aster-cloud/aster-lang-hi
        path: aster-lang-hi
        ref: ${{ inputs.sibling-ref }}
        token: ${{ inputs.cross-repo-token || github.token }}
        # 不把凭据写进 .git/config：checkout 默认会持久化 token 供后续 git 操作，
        # 于是本 job 里任何后续步骤（含 Gradle 构建脚本）都能读到这个跨仓 PAT。
        # 本 action 只需要一次性拉源码，不需要后续 git 操作 → 关掉持久化。
        persist-credentials: false

    # ★不用 setup-java 的 `cache: gradle`（wontlost-ltd/aster-api#563）：它的键只含构建文件哈希，所有 job
    #   共用一条，且「先写者胜、精确命中不再写」。main 上最先结束的是只解析一小部分依赖图的 job
    #   （实测 2026-11-18：aster-replay-runner deploy 的 build job 只跑 :runner:installDist，run 44378257595
    #   写下 177MB 的条目，PR 侧完整依赖约 330MB），之后每个 PR 的 unit / integration / guard-bypass / verify
    #   都精确命中这条残缺缓存，又各自去 Maven Central 解析缺的那一半，并行时触发 429。
    #
    #   改为按「解析同一依赖配置的一组 job」分条缓存 ~/.gradle/caches：
    #   - 调用方用 gradle-cache-group 声明分组；不声明时每个 workflow+job 单独一条。只有解析同一配置的 job
    #     才能同组（否则又回到「子集先写」的问题）。
    #   - pull_request 只读；其余事件（main 上的 push / schedule，以及 dispatch）读写。PR 作用域的条目别的 PR
    #     读不到，写了只占配额、挤掉 main 的条目；PR 从 main 作用域读同组的条目。
    #   - 构建输入（所有兄弟仓的 *.gradle* / gradle.properties / 版本目录 / wrapper 属性 / buildSrc）变化时换新键，
    #     按前缀回落到同组的最新一条，只补下载差量。
    #   - Gradle 发行版（~/.gradle/wrapper，实测 277MB，各 job 相同、由 gradle-wrapper.properties 唯一决定）
    #     单独存一条、全部 job 共用。
    #
    #   容量估算（GitHub 每仓 10GB，超出时按最近访问时间 LRU 淘汰，7 天未访问的条目自动删除）：
    #   - 调用方共 10 个 workflow×job，分成 5 条依赖缓存：
    #       group test（Test 任务都用 sourceSets.test.runtimeClasspath）：CI guard-bypass / unit / integration、
    #         Nightly fresh-it / chaos、aster-replay-runner parity-arm64（gen-expected 跑 :test）——实测 311–321MB；
    #       单独：CI verify 实测 292MB；Deploy build-and-test、perf k6 估 ≤330MB（完整依赖图上限）；
    #         aster-replay-runner build 实测 177MB。
    #     每个构建输入哈希约 1.45GB，加共用 wrapper 0.28GB，约 1.7GB（不分组时 10 条约 3.3GB）。
    #     只在托管 runner 上跑（public 仓 pick-runner 一律走托管），故只有 Linux-X64 一套。
    #   - main 上构建输入变更约每天一次（过去 14 天 14 次，多为生态 pin bump）。每次产生一套新条目，旧哈希的条目
    #     此后不再命中（精确键命中新哈希；前缀回落只取最新一条），只会闲置：7 天后自动删除，或在超过 10GB 时作为
    #     最久未访问者先被 LRU 淘汰。当前哈希的条目每次运行都被访问，不会被挤掉。
    #     最坏情况 7 天内 7 次变更：7×1.45GB + 0.28GB ≈ 10.4GB，刚过上限，由 LRU 先淘汰最旧的闲置套；
    #     常态（每周 3–5 次）约 4.6–7.5GB。
    - uses: actions/setup-java@v5
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.java-distribution }}

    - name: Compute Gradle cache key
      id: gradle-cache-key
      shell: bash
      env:
        GROUP: ${{ inputs.gradle-cache-group != '' && format('group-{0}', inputs.gradle-cache-group) || format('job-{0}-{1}', github.workflow, github.job) }}
        BUILD_INPUTS_HASH: ${{ hashFiles('**/*.gradle*', '**/gradle.properties', '**/gradle/*.versions.toml', '**/gradle-wrapper.properties', '**/versions.properties', '**/buildSrc/**') }}
      run: |
        prefix="gradle-${RUNNER_OS}-${RUNNER_ARCH}-${GROUP}-"
        echo "prefix=${prefix}" >> "$GITHUB_OUTPUT"
        echo "key=${prefix}${BUILD_INPUTS_HASH}" >> "$GITHUB_OUTPUT"
        echo "Gradle dependency cache key: ${prefix}${BUILD_INPUTS_HASH}"

    - name: Restore Gradle dependency cache (read-only)
      if: ${{ github.event_name == 'pull_request' }}
      uses: actions/cache/restore@v6
      with:
        path: ~/.gradle/caches
        key: ${{ steps.gradle-cache-key.outputs.key }}
        restore-keys: ${{ steps.gradle-cache-key.outputs.prefix }}

    - name: Restore and save Gradle dependency cache
      if: ${{ github.event_name != 'pull_request' }}
      uses: actions/cache@v6
      with:
        path: ~/.gradle/caches
        key: ${{ steps.gradle-cache-key.outputs.key }}
        restore-keys: ${{ steps.gradle-cache-key.outputs.prefix }}

    - name: Restore and save Gradle wrapper distributions
      uses: actions/cache@v6
      with:
        path: ~/.gradle/wrapper
        key: gradle-wrapper-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/gradle-wrapper.properties') }}

    # 发布共享版本目录到 Maven Local（aster-api settings 依赖它）。
    - name: Publish version catalog to Maven Local
      if: ${{ inputs.publish-catalog == 'true' }}
      shell: bash
      working-directory: aster-lang-platform
      run: ./gradlew publishToMavenLocal
