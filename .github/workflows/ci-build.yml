name: CI build (reusable)

# aster-api 的构建+测试主体，抽成 reusable workflow 的**唯一**目的是消除
# "本地 runner 优先 / 失败回落 GitHub 托管" 带来的重复：调用方 ci.yml 会最多调用
# 两次本文件（先 self-hosted、失败再 hosted），两次共用同一份步骤定义。
#
# ★并行拆分（ADR 0053 修订 A2 §8）：原来一个 job 串行跑三套测试（托管实测 24–38.6 分钟），
#   L4 的 pin PR 每次都在关键路径上等它。现拆成 checks / guard-bypass / unit / integration
#   并行，verify 等 unit 与 integration 的 jacoco 数据做覆盖率与 assemble。被调 workflow 的
#   结论仍是全部 job 的结论，ci.yml 的 ci-result、Guard bypass suite (#466) 与两个必需检查名不变。
#
# ★不要把步骤复制到 ci.yml 里。12 个步骤 × 2 份必然漂移，而本仓多次踩过
#   "单一真相源被复制后两边发散" 的坑（error_codes / ui-messages / 双 Devanagari lexer）。
#
# runs-on 由 input 传入（GitHub 允许 runs-on 取表达式，已实测 self-hosted 与
# ubuntu-latest 两个分支都能正确路由）。

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          JSON 数组字符串（如 '["ubuntu-latest"]' 或
          '["self-hosted","linux","ARM64","local-linux"]'）。用 JSON 而非纯字符串，
          才能表达 self-hosted 的多标签选择。
        required: true
        type: string
    outputs:
      # 「Guard bypass suite (#466)」步骤的 outcome（success / failure / skipped / cancelled），
      # 由 ci.yml 的汇总作业 `Guard bypass suite (#466)` 判定（scripts/ci/guard-bypass-verdict.sh）。
      guard-bypass:
        description: Guard 绕过套件步骤的 outcome
        value: ${{ jobs.guard-bypass.outputs.guard-bypass }}
    # 不声明 secrets：本 workflow 的步骤不引用任何 secrets（已核实）。codecov-action
    # 在 public 仓走 tokenless 上传，且该步已设 fail_ci_if_error: false +
    # continue-on-error，不是门禁。★转私后若 codecov 需要 token，在此显式加
    # `secrets: CODECOV_TOKEN` 并由调用方 `secrets: inherit` 传入。

permissions:
  contents: read

jobs:
  # 秒级的静态与脚本门禁，与测试并行。任一失败即整次 CI 失败（与拆分前语义相同）。
  checks:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    # 含 actionlint 下载与自建 runner 上可能的 jq/yq 安装，留足网络慢时的余量。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          path: aster-api

      # ★版本 pin 一致性门禁：settings.gradle 的 platform catalog 版本必须与
      #   setup-aster-build 的 sibling-ref 默认值一致。1.0.29 发版实测：生态 bump
      #   只改了 settings.gradle，sibling-ref 仍停在 v1.0.28，于是 release train 的
      #   12 个制品全部发布成功后，最后一步 aster-api 部署才失败——发了一半的车。
      #   先跑脚本离线测试（含「自检不得发假 ::error:: 注解」），再跑反向自检
      #   （门禁必须能变红），最后跑正式检查。
      - name: 兄弟仓 ref 与 catalog 版本一致性（含反向自检）
        working-directory: aster-api
        run: |
          bash scripts/ci/verify-sibling-ref-pin.test.sh
          ./scripts/ci/verify-sibling-ref-pin.sh --self-test
          ./scripts/ci/verify-sibling-ref-pin.sh

      # image-pin PR 合并门控：只在 k3s verify-image-pin 通过后合并（aster-cloud#506）。离线测试，无网络。
      # 主流程测试需要 git/jq/yq；自建 runner 可能缺 jq，先装上，避免因缺依赖被跳过造成假绿。
      - name: image-pin merge gate tests
        working-directory: aster-api
        run: |
          command -v jq >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq jq; }
          command -v yq >/dev/null || { sudo curl -fsSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 && sudo chmod +x /usr/local/bin/yq; }
          bash scripts/ci/open-image-pin-pr-merge.test.sh
          bash scripts/ci/open-image-pin-pr-flow.test.sh
          bash scripts/ci/pin-closure-guard.test.sh
          # ADR 0053：deploy 构建复用键（remote/local 一致、源码变化即失效、fail-closed）
          bash scripts/ci/build-reuse-key.test.sh
          bash scripts/ci/verify-artifact-run.test.sh
          # #466：必需检查 `Guard bypass suite (#466)` 的判定脚本（6 例，含「本地红、托管绿」告警）
          bash scripts/ci/guard-bypass-verdict.test.sh
          # docs-only：必需检查 `ci-result` 的判定脚本（docs-only 时两条路径都 skipped 判通过，其余 fail-closed）
          bash scripts/ci/ci-result-verdict.test.sh

      # workflow 静态检查（review L12）：钉死版本，自建 ARM64 runner 与托管 runner 均可（脚本按架构下载）。
      - name: actionlint
        working-directory: aster-api
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7 "$RUNNER_TEMP"
          # -shellcheck= ：只校验 workflow 结构/表达式。托管 runner 自带 shellcheck，会把各 workflow
          # 既有的 info 级提示（SC2086 等）也判失败——那是另一项治理，不在本门禁范围。
          "$RUNNER_TEMP/actionlint" -color -shellcheck=

      # ★Quarkus plugin 与 quarkus-bom 必须同版本（build.gradle:4 的不变式）。
      #   此前只有注释、没有门禁，dependabot 会把两者拆成**不同版本**的两个 PR
      #   （#286 → plugin 3.39.0；#284 → BOM 3.38.3），任何组合都得不到一致的版本对，
      #   而 CI 不会拦。git 历史 15a1a8d 正是上一次同类漂移的补救提交——已发生两次。
      #   放在 setup 之前：这是纯文本检查，秒级，不该等构建跑完才报。
      - name: Verify Quarkus plugin/BOM lockstep
        working-directory: aster-api
        run: |
          set -euo pipefail
          PLUGIN=$(grep -oE "id 'io\\.quarkus' version '[^']+'" build.gradle | grep -oE "[0-9]+\\.[0-9]+\\.[0-9]+")
          BOM=$(grep -oE "io\\.quarkus\\.platform:quarkus-bom:[^']+" build.gradle | grep -oE "[0-9]+\\.[0-9]+\\.[0-9]+")
          echo "plugin=$PLUGIN bom=$BOM"
          if [ -z "$PLUGIN" ] || [ -z "$BOM" ]; then
            echo "::error::无法从 build.gradle 解析出 Quarkus plugin/BOM 版本——锚点可能被改动，请更新本检查"
            exit 1
          fi
          if [ "$PLUGIN" != "$BOM" ]; then
            echo "::error::Quarkus plugin ($PLUGIN) != quarkus-bom ($BOM)。二者必须同版本升级（build.gradle:4）——plugin/BOM skew 会拉进不匹配的 codegen 与 runtime 制品。"
            exit 1
          fi
          echo "✓ Quarkus plugin/BOM 一致：$PLUGIN"


  # Guard 绕过红队套件（#466）。输出 guard-bypass 是该步骤的 outcome，经本 workflow 的同名输出交给
  # ci.yml 的必需检查 `Guard bypass suite (#466)`（scripts/ci/guard-bypass-verdict.sh）。
  guard-bypass:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    # ★timeout-minutes 只限制作业开始运行之后的时长（不含排队）。拆分前单 job 为 60 分钟（托管实测
    #   24–38.6 分钟）；拆分后每个 job 只跑一套测试，各给约 2 倍于实测的上限。
    timeout-minutes: 25
    outputs:
      guard-bypass: ${{ steps.bypass.outcome }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aster_policy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # 固定 localhost:6379 Redis。用 MockProfile 的 IT（MixpanelClientIT /
      # PlanGateServiceIT 等）不走 RedisTestResource，redis 配置取
      # application.properties 默认 localhost:6379；无此 service 时它们报
      # `redis read failed: Connection refused localhost:6379` 噪声。
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: aster-api

      # ★刻意不传 cross-repo-token（见 ci.yml 顶部 on.pull_request 注释）：7 个兄弟仓均为
      #   public，composite action 回退 github.token 即可 checkout。
      - name: Setup Aster build (siblings + JDK + version catalog)
        uses: ./aster-api/.github/actions/setup-aster-build

      # Testcontainers 复用：CI 内单 job 多 test class 重用容器，加速集成测试
      # 安全：CI 容器在 job 结束自动销毁，reuse 仅限 job 生命周期内
      - name: Configure Testcontainers reuse
        run: |
          mkdir -p $HOME
          cat > $HOME/.testcontainers.properties <<EOF
          testcontainers.reuse.enable=true
          checks.disable=true
          ryuk.disabled=true
          EOF

      # 预拉镜像让 Testcontainers 启动更稳；postgres:17-alpine 与 PostgresTestResource.java 一致
      - name: Pre-pull test images
        run: |
          docker pull postgres:17-alpine &
          docker pull redis:7-alpine &
          wait

      # 绕过套件阶段 B（#466）：ProxyHarness 以 Node 运行 e2e/guard-bypass 的脚本化 Agent，拉起钉死版本的
      # 已发布包 @aster-cloud/aster-guard（aster-guard-mcp）。pnpm 版本取自该目录 package.json 的 packageManager
      # （与 aster-guard 仓 CI 同法）；lockfile 冻结安装，依赖经 setup-node 的 pnpm 缓存复用。
      - name: Install pnpm (guard bypass e2e)
        uses: pnpm/action-setup@v6
        with:
          package_json_file: aster-api/e2e/guard-bypass/package.json

      - name: Setup Node.js 24 (guard bypass e2e)
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: aster-api/e2e/guard-bypass/pnpm-lock.yaml

      - name: Install guard bypass e2e dependencies
        working-directory: aster-api/e2e/guard-bypass
        run: pnpm install --frozen-lockfile

      # Guard 绕过红队套件（wontlost-ltd/aster-api#466）：JUnit 标签 guard-bypass，独立 Gradle 任务、retry 0。
      # 放在快测之前：安全门先给结论。outcome 经作业输出 guard-bypass 交给 ci.yml 的同名汇总作业，
      # 那是分支保护登记的必需检查；本步失败会让 build-local 失败并触发托管回落（语义同 ci-result）。
      # ASTER_GUARD_BYPASS_REQUIRE_NODE=1：缺 Node 或 node_modules 时阶段 B 用例失败而不是跳过。
      - name: Guard bypass suite (#466)
        id: bypass
        working-directory: aster-api
        run: ./gradlew guardBypassTest --build-cache
        env:
          ASTER_GUARD_BYPASS_REQUIRE_NODE: "1"
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DB_JDBC_URL: "jdbc:postgresql://localhost:5432/aster_policy"
          DB_REACTIVE_URL: "postgresql://localhost:5432/aster_policy"
          DB_USERNAME: "postgres"
          DB_PASSWORD: "postgres"

      # 诊断制品（非致命，见原单 job 版本的说明）：每个测试 job 上传自己的 test-results-*。
      - name: Summarize failed tests (no checks:write needed)
        if: always()
        working-directory: aster-api
        continue-on-error: true
        run: python3 scripts/ci/summarize-failed-tests.py build/test-results >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Test Results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          overwrite: true
          name: test-results-guard-bypass-${{ inputs.runs-on == '["ubuntu-latest"]' && 'hosted' || 'local' }}
          path: aster-api/build/test-results

  unit:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aster_policy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # 固定 localhost:6379 Redis。用 MockProfile 的 IT（MixpanelClientIT /
      # PlanGateServiceIT 等）不走 RedisTestResource，redis 配置取
      # application.properties 默认 localhost:6379；无此 service 时它们报
      # `redis read failed: Connection refused localhost:6379` 噪声。
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: aster-api

      # PrismaDatabaseE2ETest 用独立的 aster_test 库（其 profile 指向它）。
      - name: Create aster_test database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE aster_test;" || true

      - name: Setup Aster build (siblings + JDK + version catalog)
        uses: ./aster-api/.github/actions/setup-aster-build

      # Testcontainers 复用：CI 内单 job 多 test class 重用容器，加速集成测试
      # 安全：CI 容器在 job 结束自动销毁，reuse 仅限 job 生命周期内
      - name: Configure Testcontainers reuse
        run: |
          mkdir -p $HOME
          cat > $HOME/.testcontainers.properties <<EOF
          testcontainers.reuse.enable=true
          checks.disable=true
          ryuk.disabled=true
          EOF

      # 预拉镜像让 Testcontainers 启动更稳；postgres:17-alpine 与 PostgresTestResource.java 一致
      - name: Pre-pull test images
        run: |
          docker pull postgres:17-alpine &
          docker pull redis:7-alpine &
          wait

      # ADR 0059 P2 T11：导出的策略包须通过 conformance package-v1 参照检查（PackageConformanceReferenceTest）。
      # 兄弟检出钉在 src/test/resources/package-v1/SOURCE.md 记录的同一提交，夹具副本与参照实现同源。
      - name: Checkout aster-lang-test (package-v1 reference check)
        uses: actions/checkout@v7
        with:
          repository: aster-cloud/aster-lang-test
          path: aster-lang-test
          ref: c7219e201a20c2883885e02c709b751741f0d1b7

      - name: Setup Node.js 24 (package-v1 reference check)
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Unit Tests (fast feedback)
        working-directory: aster-api
        run: ./gradlew test --build-cache
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          # 参照检查在 CI 必须实际执行：兄弟检出或 node 缺失即失败，而不是静默跳过
          ASTER_EXPORT_REFERENCE_REQUIRE: "1"
          # 指向上面的 postgres service，让连默认 localhost:5432 的 @QuarkusTest
          # DB 测试稳定可用。integrationTest 步骤不设这些（它走 Testcontainers）。
          DB_JDBC_URL: "jdbc:postgresql://localhost:5432/aster_policy"
          DB_REACTIVE_URL: "postgresql://localhost:5432/aster_policy"
          DB_USERNAME: "postgres"
          DB_PASSWORD: "postgres"

      # 覆盖率数据交给 verify 聚合（只在本 run 内传递，1 天即过期）。
      - name: Upload jacoco test.exec
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-test-${{ inputs.runs-on == '["ubuntu-latest"]' && 'hosted' || 'local' }}
          path: aster-api/build/jacoco/test.exec
          if-no-files-found: error
          retention-days: 1
          # 只重跑失败 job 时（列车对超时自动重跑一次、或人工 rerun --failed），重跑的 job 覆盖上一次
          # attempt 的同名制品；未重跑的 job 的制品原样保留，verify 照样能取到两份。
          overwrite: true
      # 诊断制品（非致命，见原单 job 版本的说明）：每个测试 job 上传自己的 test-results-*。
      - name: Summarize failed tests (no checks:write needed)
        if: always()
        working-directory: aster-api
        continue-on-error: true
        run: python3 scripts/ci/summarize-failed-tests.py build/test-results >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Test Results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          overwrite: true
          name: test-results-unit-${{ inputs.runs-on == '["ubuntu-latest"]' && 'hosted' || 'local' }}
          path: aster-api/build/test-results

  integration:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 30
    # MockProfile 的 IT（MixpanelClientIT / PlanGateServiceIT 等）连默认 localhost:6379，需要 Redis service。
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aster_policy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # 固定 localhost:6379 Redis。用 MockProfile 的 IT（MixpanelClientIT /
      # PlanGateServiceIT 等）不走 RedisTestResource，redis 配置取
      # application.properties 默认 localhost:6379；无此 service 时它们报
      # `redis read failed: Connection refused localhost:6379` 噪声。
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: aster-api

      # ★刻意不传 cross-repo-token（见 ci.yml 顶部 on.pull_request 注释）：7 个兄弟仓均为
      #   public，composite action 回退 github.token 即可 checkout。
      - name: Setup Aster build (siblings + JDK + version catalog)
        uses: ./aster-api/.github/actions/setup-aster-build

      # Testcontainers 复用：CI 内单 job 多 test class 重用容器，加速集成测试
      # 安全：CI 容器在 job 结束自动销毁，reuse 仅限 job 生命周期内
      - name: Configure Testcontainers reuse
        run: |
          mkdir -p $HOME
          cat > $HOME/.testcontainers.properties <<EOF
          testcontainers.reuse.enable=true
          checks.disable=true
          ryuk.disabled=true
          EOF

      # 预拉镜像让 Testcontainers 启动更稳；postgres:17-alpine 与 PostgresTestResource.java 一致
      - name: Pre-pull test images
        run: |
          docker pull postgres:17-alpine &
          docker pull redis:7-alpine &
          wait

      - name: Integration Tests (Testcontainers)
        working-directory: aster-api
        run: ./gradlew integrationTest --build-cache
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

      # 覆盖率数据交给 verify 聚合（只在本 run 内传递，1 天即过期）。
      - name: Upload jacoco integrationTest.exec
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-integrationTest-${{ inputs.runs-on == '["ubuntu-latest"]' && 'hosted' || 'local' }}
          path: aster-api/build/jacoco/integrationTest.exec
          if-no-files-found: error
          retention-days: 1
          # 只重跑失败 job 时（列车对超时自动重跑一次、或人工 rerun --failed），重跑的 job 覆盖上一次
          # attempt 的同名制品；未重跑的 job 的制品原样保留，verify 照样能取到两份。
          overwrite: true
      # 诊断制品（非致命，见原单 job 版本的说明）：每个测试 job 上传自己的 test-results-*。
      - name: Summarize failed tests (no checks:write needed)
        if: always()
        working-directory: aster-api
        continue-on-error: true
        run: python3 scripts/ci/summarize-failed-tests.py build/test-results >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Test Results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          overwrite: true
          name: test-results-integration-${{ inputs.runs-on == '["ubuntu-latest"]' && 'hosted' || 'local' }}
          path: aster-api/build/test-results

  # 覆盖率聚合与 assemble：等 unit 与 integration 都成功后，下载两份 exec 到原位置，
  # 其余与拆分前完全相同（含「exec 缺失/为空即失败」的前置断言）。
  # 本 job 重新编译 class：jacoco 按 class 字节匹配 exec，同源码同 JDK 编译结果一致；万一不一致，
  # 覆盖率会偏低、校验失败（fail-closed），不会假过。
  verify:
    needs: [unit, integration]
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          path: aster-api

      # ★刻意不传 cross-repo-token（见 ci.yml 顶部 on.pull_request 注释）：7 个兄弟仓均为
      #   public，composite action 回退 github.token 即可 checkout。
      - name: Setup Aster build (siblings + JDK + version catalog)
        uses: ./aster-api/.github/actions/setup-aster-build

      - name: Download jacoco exec
        uses: actions/download-artifact@v8
        with:
          pattern: jacoco-*-${{ inputs.runs-on == '["ubuntu-latest"]' && 'hosted' || 'local' }}
          path: aster-api/build/jacoco
          merge-multiple: true

      # 聚合 test + integrationTest 的覆盖率，verification 在指定包上做强约束。
      # ★-x test -x integrationTest（时长优化）：jacocoTestReport dependsOn 'test'，此步是
      # 独立 gradle 调用，不排除的话 Gradle 会重跑 test（上游步骤已跑过一遍）——实测 CI 此步
      # 340s 几乎全是冗余 test 重跑。jacocoReport 只需读上游产出的 build/jacoco/*.exec，
      # 显式排除 test/integrationTest 后仅做聚合，本地实测从 340s → 1s。
      # ★fail-closed 前置（Codex 审 Medium）：-x test 依赖上游步骤已产出 exec。若上游 test
      # 因 build-cache 命中被跳过且未恢复 exec，coverage 可能用旧/空数据让门禁假过。故先断言
      # 两个 exec 存在且非空（-s），缺失即 fail，把「覆盖率门禁基于真实本次数据」变成硬约束。
      - name: Coverage Report + Verification
        working-directory: aster-api
        run: |
          test -s build/jacoco/test.exec || { echo "::error::build/jacoco/test.exec 缺失/为空——上游 Unit Tests 未产出覆盖率数据，拒绝聚合（避免门禁假过）"; exit 1; }
          test -s build/jacoco/integrationTest.exec || { echo "::error::build/jacoco/integrationTest.exec 缺失/为空——上游 Integration Tests 未产出覆盖率数据"; exit 1; }
          ./gradlew jacocoTestReport jacocoCoverageVerification -x test -x integrationTest
          test -s build/reports/jacoco/test/jacocoTestReport.xml || { echo "::error::jacoco 报告未生成"; exit 1; }

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: aster-api/build/reports/jacoco/test/jacocoTestReport.xml
          flags: backend
          fail_ci_if_error: false
        continue-on-error: true

      - name: Build (assemble + check)
        working-directory: aster-api
        # check 已包含 integrationTest 与 guardBypassTest，但前面单独跑过 → 这一步主要做 assemble
        run: ./gradlew build --build-cache --parallel -x test -x integrationTest -x guardBypassTest

      # Chaos tests moved to nightly.yml (see "Chaos Tests" step there).
      # Rationale: 24 chaos scenarios add ~minutes to every PR for low marginal
      # signal — they catch slow-burn regressions better when run daily on main
      # than on every push. Run locally on demand: ./gradlew testChaos

      # ★原 dorny/test-reporter 步已移除（审计 2026-07-30）：它是本 workflow 唯一需要
      #   `checks: write` 的步骤，而在 public 仓 + fork PR 场景下，把写 check 的权限
      #   交给运行 PR 可控代码的 job = 可伪造绿色检查结论。相比"报告好看"，去掉写权限
      #   更重要。
      #   替代：失败摘要直接打进 job 日志（下面这步），完整 XML 仍在 test-results 制品里。
      - name: Summarize failed tests (no checks:write needed)
        if: always()
        working-directory: aster-api
        continue-on-error: true
        run: python3 scripts/ci/summarize-failed-tests.py build/test-results >> "$GITHUB_STEP_SUMMARY"
