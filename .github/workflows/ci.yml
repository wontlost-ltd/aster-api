name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.claude/**'
  # ★本 workflow **刻意不注入 secrets.CROSS_REPO_TOKEN**（审计 2026-07-30 P0 结构性修复）。
  #
  #   原风险：pull_request 触发下把跨仓 PAT 注入同一 job，而该 job 随后在 **PR 可控的**
  #   build.gradle / gradlew / wrapper jar 上执行 ./gradlew test。仓库转 public 后，
  #   任意外部人员提 PR 即可尝试窃取该 PAT（GitHub 默认不向 fork PR 下发 secret，但
  #   这是"靠平台默认设置兜底"，不是结构性保证）。
  #
  #   修法（治本，非收窄）：**CI 不再需要该 PAT**——7 个兄弟仓（platform/core/runtime/
  #   truffle/validation/locales/hi）现均为 public，github.token 甚至完全无凭据即可
  #   checkout（已实测无凭据 git clone 成功）。故这里不传 cross-repo-token，composite
  #   action 回退 github.token。job 里再没有可窃取的跨仓凭据 = 攻击面消失，而不是被条件
  #   语句挡住。
  #
  #   ★若将来任一兄弟仓转回 private：本 workflow 的 checkout 会失败（fail 而非静默降级，
  #   因下方 require-cross-repo-token 未设 true 时 action 会用 github.token 尝试并失败），
  #   届时必须改用 GitHub App 短时 token 或发布制品替代源码 includeBuild，**不要**简单地
  #   把 PAT 加回 pull_request 路径。
  #
  #   deploy/nightly/perf/replay-runner 仍传 PAT 且 require-cross-repo-token: "true"——
  #   它们不由 fork PR 触发（push/schedule/dispatch），受控凭据策略保持不变。
  pull_request:
    branches: [main]
  workflow_dispatch:

# 最小权限：仅读内容。★不要 checks: write——它此前只为 dorny/test-reporter 而存在，
# 而在 public 仓的 fork PR 场景下，写 check 的权限意味着可伪造绿色检查结论。
# 测试结果改由 job 自身的成败 + Upload Test Results 制品表达。
permissions:
  contents: read

# 同一 ref 上新 push 到来时取消尚在跑的过时 CI（PR 连续 push 常见）——省算力，且过时
# 提交的绿/红没有意义。按 github.ref 分组：PR 是 refs/pull/<n>/merge（同一 PR 的连续 push
# 同组→取消旧的），push main 是 refs/heads/main。主要收益在 PR 迭代（main 上极少连续 push）。
# deploy 不设 cancel-in-progress（部署不可中途取消；过时部署由 deploy 的 stale-guard 拦，见
# deploy.yml）。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # ── 1. 选 runner：本地优先，不可用则托管 ──────────────────────────────
  # ★GitHub 没有原生的"本地优先否则托管"：只写 runs-on: [self-hosted,…] 时，runner
  #   离线会让 job **无限排队**（默认 24h 超时）而不回落，不满足"不可用时启用 GitHub
  #   自带 runner"。故先用一个几秒的托管 probe 查 runner 实况。
  #   probe 自身按分钟取整算 1 min，相对它调度走的 ~12 分钟 build 完全值得。
  pick-runner:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.pick.outputs.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: pick
        uses: ./.github/actions/pick-runner
        with:
          labels: self-hosted,linux,ARM64,local-linux
          # 只读 runner 状态的最小权限 token。未配置/无权限/API 出错时，action 一律
          # 保守回落 hosted（四条路径均已本地实测）——探测器绝不能成为 CI 故障点。
          token: ${{ secrets.RUNNER_PROBE_TOKEN }}

  # ── 2. 首选：本地 self-hosted（省托管额度）────────────────────────────
  # 只在 probe 判定 local 时运行。步骤定义在 ci-build.yml，与下面的 hosted 回落
  # 共用同一份（不复制 12 个步骤——本仓多次踩过"复制后两边发散"的坑）。
  build-local:
    needs: pick-runner
    if: needs.pick-runner.outputs.target == 'local'
    uses: ./.github/workflows/ci-build.yml
    with:
      runs-on: '["self-hosted","linux","ARM64","local-linux"]'

  # ── 3. 回落：GitHub 托管 ──────────────────────────────────────────────
  # 两种情况都会跑：
  #   (a) probe 判定本地不可用（离线/busy/无 token）→ build-local 被 skip；
  #   (b) 本地 runner 在线但 job 真的失败/被取消（磁盘满、socket 挂等）。
  # ★用 always() + result 判断而非 failure()：skipped 不是 failure，只写
  #   failure() 会导致情况 (a) 两个 job 都不跑 = CI 静默不执行（假绿）。
  build-hosted:
    needs: [pick-runner, build-local]
    if: always() && needs.build-local.result != 'success'
    uses: ./.github/workflows/ci-build.yml
    with:
      runs-on: '["ubuntu-latest"]'

  # ── 4. 汇总门禁：给分支保护用的单一必需检查 ────────────────────────────
  # ★必需：build-local / build-hosted 互为条件分支，任一都可能 skipped，无法直接
  #   作为 required check（skipped 会被当成"未运行"而卡住合并）。故用本 job 收敛成
  #   一个确定结论：只要有任意一条路径成功就绿，两条都没成功就红（fail-closed）。
  ci-result:
    needs: [build-local, build-hosted]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 判定 CI 结论
        env:
          LOCAL: ${{ needs.build-local.result }}
          HOSTED: ${{ needs.build-hosted.result }}
        run: |
          set -euo pipefail
          echo "build-local=$LOCAL  build-hosted=$HOSTED"
          if [[ "$LOCAL" == "success" || "$HOSTED" == "success" ]]; then
            echo "✅ CI 通过（至少一条路径成功）"
            exit 0
          fi
          echo "::error::CI 失败——本地与托管两条路径均未成功（local=$LOCAL hosted=$HOSTED）"
          exit 1
