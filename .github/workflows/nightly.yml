name: Nightly (fresh-container IT + chaos)

on:
  # UTC 03:00 = 北京 11:00（避开夜间维护窗口又比上班早 → 出问题马上能看到）
  schedule:
    - cron: '0 3 * * 1-5'   # 工作日跑（Actions 配额）：周末无提交
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  issues: write   # ui-messages-drift 漂移时开/关 issue

jobs:
  fresh-it:
    runs-on: ubuntu-latest
    # 同 ci.yml：部分 *IT（PlanCacheResourceIT/PlanGateServiceIT/WaadrMetricsResourceIT
    # 等，多为 MockProfile 或不挂 @QuarkusTestResource）连默认 localhost:5432/6379。
    # 无固定 service 时 ConnectException（连挂 6 天）。Testcontainers 仍服务于走
    # @QuarkusTestResource 的 *IT；两者共存（与 ci.yml 一致）。
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aster_policy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: aster-api

      - name: Setup Aster build (siblings + JDK + version catalog)
        uses: ./aster-api/.github/actions/setup-aster-build
        with:
          cross-repo-token: ${{ secrets.CROSS_REPO_TOKEN }}
          # 生产链路 fail-closed：凭据缺失即失败，不静默回退 github.token。
          require-cross-repo-token: "true"

      # 显式禁用 reuse，确保每次起新容器
      - name: Configure Testcontainers (no reuse)
        run: |
          mkdir -p $HOME
          cat > $HOME/.testcontainers.properties <<EOF
          testcontainers.reuse.enable=false
          checks.disable=true
          EOF

      - name: Pre-pull test images
        run: |
          docker pull postgres:17-alpine &
          docker pull redis:7-alpine &
          wait

      - name: Fresh Integration Tests
        working-directory: aster-api
        run: ./gradlew integrationTestFresh
        env:
          TESTCONTAINERS_REUSE_ENABLE: "false"
          TESTCONTAINERS_RYUK_DISABLED: "false"
          # 指向上面的 postgres service（与 ci.yml 一致），让连默认 localhost:5432
          # 的 *IT 稳定；走 @QuarkusTestResource 的 *IT 仍各自起 Testcontainers。
          DB_JDBC_URL: "jdbc:postgresql://localhost:5432/aster_policy"
          DB_REACTIVE_URL: "postgresql://localhost:5432/aster_policy"
          DB_USERNAME: "postgres"
          DB_PASSWORD: "postgres"

      - name: Publish JUnit Report
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Nightly Fresh-Container IT
          path: build/test-results/**/*.xml
          reporter: java-junit
          fail-on-error: false
          working-directory: aster-api
          # Trim to failures only — full nightly IT suite output blows
          # past the Checks API 65535-byte cap.
          list-suites: failed
          list-tests: failed
          max-annotations: 50

      - name: Upload Test Results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: nightly-fresh-it-results
          path: aster-api/build/test-results

  chaos:
    # 与 fresh-it 解耦：chaos 失败不阻塞 fresh-it 结果，反之亦然
    runs-on: ubuntu-latest
    # WorkflowChaosTest 是 @QuarkusTest extends CrashRecoveryTestBase，未挂
    # @QuarkusTestResource(PostgresTestResource)，连 application.properties 默认
    # ${DB_JDBC_URL:...localhost:5432}。无固定 5432 service 时 Quarkus 启动即
    # ConnectException → 全 26 个 chaos test fail/skip（连挂 6 天的根因）。提供与
    # ci.yml build job 同款的 postgres+redis service + DB_* env 让其稳定可用。
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aster_policy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: aster-api

      - name: Setup Aster build (siblings + JDK + version catalog)
        uses: ./aster-api/.github/actions/setup-aster-build
        with:
          cross-repo-token: ${{ secrets.CROSS_REPO_TOKEN }}
          # 生产链路 fail-closed：凭据缺失即失败，不静默回退 github.token。
          require-cross-repo-token: "true"

      - name: Pre-pull test images
        run: |
          docker pull postgres:17-alpine &
          docker pull redis:7-alpine &
          wait

      - name: Chaos Tests
        working-directory: aster-api
        # continue-on-error: chaos 偶发抖动不阻塞 nightly 结果；
        # 真实回归靠每日 JUnit 报告人工巡检
        continue-on-error: true
        run: ./gradlew testChaos
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          # 指向上面的 postgres service（与 ci.yml build job 一致），让连默认
          # localhost:5432 的 @QuarkusTest chaos 测试稳定启动。
          DB_JDBC_URL: "jdbc:postgresql://localhost:5432/aster_policy"
          DB_REACTIVE_URL: "postgresql://localhost:5432/aster_policy"
          DB_USERNAME: "postgres"
          DB_PASSWORD: "postgres"

      # R10-CI-7 + R11-CI：哨兵步骤 —— 要求
      #   (1) 至少 1 个 JUnit XML 报告
      #   (2) 至少 1 个真实跑过的 test (tests>0, skipped<tests)
      #   (3) failures+errors == 0
      # 上一轮 R10 仅查 (1)(2)，导致 chaos step continue-on-error=true 时
      # 真实 test failure 静默通过。R11 把 nightly 变成真正的回归门禁。
      - name: Verify chaos tests actually ran AND passed
        if: always()
        working-directory: aster-api
        run: |
          set -e
          XML_DIR=build/test-results
          XML_COUNT=$(find "$XML_DIR" -name '*.xml' 2>/dev/null | wc -l | tr -d ' ')
          echo "JUnit XML report count: $XML_COUNT"
          if [ "$XML_COUNT" -lt 1 ]; then
            echo "::error::No JUnit XML reports produced — chaos task likely failed before tests ran."
            echo "  Check the Chaos Tests step log for Gradle config / classpath errors."
            exit 1
          fi
          # 解析 <testsuite tests="N" skipped="K" failures="F" errors="E"> 属性
          TOTAL_TESTS=0
          TOTAL_SKIPPED=0
          TOTAL_FAILURES=0
          TOTAL_ERRORS=0
          while IFS= read -r xml; do
            T=$(grep -oE 'tests="[0-9]+"' "$xml" | head -1 | grep -oE '[0-9]+' || echo 0)
            S=$(grep -oE 'skipped="[0-9]+"' "$xml" | head -1 | grep -oE '[0-9]+' || echo 0)
            F=$(grep -oE 'failures="[0-9]+"' "$xml" | head -1 | grep -oE '[0-9]+' || echo 0)
            E=$(grep -oE 'errors="[0-9]+"' "$xml" | head -1 | grep -oE '[0-9]+' || echo 0)
            TOTAL_TESTS=$((TOTAL_TESTS + T))
            TOTAL_SKIPPED=$((TOTAL_SKIPPED + S))
            TOTAL_FAILURES=$((TOTAL_FAILURES + F))
            TOTAL_ERRORS=$((TOTAL_ERRORS + E))
          done < <(find "$XML_DIR" -name '*.xml')
          RAN=$((TOTAL_TESTS - TOTAL_SKIPPED))
          echo "Total tests=$TOTAL_TESTS skipped=$TOTAL_SKIPPED ran=$RAN failures=$TOTAL_FAILURES errors=$TOTAL_ERRORS"
          if [ "$TOTAL_TESTS" -lt 1 ]; then
            echo "::error::JUnit XML present but tests=0 — chaos suite likely couldn't load test classes."
            exit 1
          fi
          if [ "$RAN" -lt 1 ]; then
            echo "::error::All $TOTAL_TESTS chaos tests were skipped (likely Quarkus boot failed)."
            echo "  Check the Chaos Tests step log for boot/config failures."
            exit 1
          fi
          # R11-CI：真实测试失败必须 fail nightly。否则 continue-on-error 让 chaos failure
          # 永远不会被运营看到。
          REGRESSIONS=$((TOTAL_FAILURES + TOTAL_ERRORS))
          if [ "$REGRESSIONS" -gt 0 ]; then
            echo "::error::Chaos tests reported $TOTAL_FAILURES failures + $TOTAL_ERRORS errors."
            echo "  Inspect the JUnit Report artifact for stack traces."
            exit 1
          fi

      - name: Publish JUnit Report
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Nightly Chaos Tests
          path: build/test-results/**/*.xml
          reporter: java-junit
          fail-on-error: false
          working-directory: aster-api
          list-suites: failed
          list-tests: failed
          max-annotations: 50

      - name: Upload Test Results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: nightly-chaos-results
          path: aster-api/build/test-results
          if-no-files-found: error

  # ── ui-messages classpath 副本漂移守卫 ────────────────────────────────
  # 仓内已有 UiMessagesClasspathSiblingParityTest 守同一不变式，但它只在
  # **aster-api 有 PR** 时才跑。真实漏洞正是「改了语言包却根本不碰 aster-api」
  # ——没有 PR，守门没机会执行（2026-08-03 实测：线上因此显示裸 key）。
  # 本 job 从时间维度补缺口：每晚主动比对，漂移即开 issue。
  # 只读 + 开 issue，不改任何仓代码，故只需内置 GITHUB_TOKEN。
  ui-messages-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: aster-api
      - uses: actions/checkout@v6
        with:
          repository: aster-cloud/aster-lang-locales
          path: aster-lang-locales
      - uses: actions/checkout@v6
        with:
          repository: aster-cloud/aster-lang-hi
          path: aster-lang-hi

      - name: Detect drift
        id: drift
        shell: bash
        run: |
          set -uo pipefail
          if out=$(python3 aster-api/scripts/ci/check-ui-messages-drift.py .); then
            echo "$out"
            echo "drifted=false" >> "$GITHUB_OUTPUT"
          else
            rc=$?
            echo "$out"
            [ "$rc" = "1" ] || { echo "::error::检测脚本异常退出 rc=$rc"; exit "$rc"; }
            echo "::error::ui-messages classpath 副本与语言包源漂移"
            echo "drifted=true" >> "$GITHUB_OUTPUT"
            { echo "detail<<DRIFT_EOF"; echo "$out"; echo "DRIFT_EOF"; } >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update drift issue
        if: steps.drift.outputs.drifted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DETAIL: ${{ steps.drift.outputs.detail }}
          TITLE: ui-messages classpath 副本与语言包源漂移
        shell: bash
        run: bash aster-api/scripts/ci/report-ui-messages-drift.sh open

      - name: Close drift issue when back in sync
        if: steps.drift.outputs.drifted == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ui-messages classpath 副本与语言包源漂移
        shell: bash
        run: bash aster-api/scripts/ci/report-ui-messages-drift.sh close
