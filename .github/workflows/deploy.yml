name: Deploy

# ★列车关联信号（ADR 0053 §6）：带 trainId 的 dispatch 把 run 标题设成「Deploy · train <id>」，
#   release train 据此精确找到**自己**触发的 run（旧做法取「最新一个 dispatch run」，任何手工
#   dispatch 都会让它关联错）；列车 cleanup 也按此标题识别本列车的中间制品。
run-name: ${{ inputs.trainId && format('Deploy · train {0}', inputs.trainId) || github.event.head_commit.message || 'Deploy' }}

on:
  push:
    branches: [main]
    # 不设 paths-ignore（Codex 交叉审 High）：deploy 用「github.sha == origin/main tip」做
    # stale-guard 防过时部署，其正确性前提是「每个 main commit 都有自己的 deploy run 接手」。
    # 若这里 paths-ignore 掉 docs/治理提交，会出现死角：代码提交 A 触发 deploy，随后 docs-only
    # 提交 B 前进 main 但**不**触发 deploy → A 的 guard 看到 tip=B 判自己过时而跳过，B 又没有
    # run 接手 → A 的代码永不上线。让每个 commit 都触发 deploy，docs-only 提交会正常成为 tip
    # 并无害地重部署（rollout restart 幂等）。省"无害重部署"的收益不值这个正确性死角。
  workflow_dispatch:
    inputs:
      trainId:
        description: >-
          发布列车标识。**由 release train 传入**，表示本次 dispatch 是发版链路的
          一环，需要走完整闭环（含 image-pin PR）。

          ★为什么需要它：image-pin-pr 原本只认 `github.event_name == 'push'`，
          而列车用 workflow_dispatch —— 于是列车触发的部署**永远不会开 pin PR**，
          集群不换版本，而列车那头只表现为一个「等待超时」（platform#82）。
          1.0.29 能上线纯属侥幸：当时恰好另有一个 PR 合进 main，那次 push
          顺带跑完了整条链路。

          手工 dispatch（调试/重跑）留空即可：不开 pin PR，也不会被判失败。
        type: string
        required: false
        default: ''
      forceRebuild:
        description: >-
          跳过复用（ADR 0053 §5）：不复用已验证的 quarkus-app 制品 / 已签名镜像，强制完整
          build&test 并重新构建镜像。怀疑复用产物有问题时用。
        type: boolean
        required: false
        default: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# 顶层最小权限默认（缺省时 GitHub 授予宽泛读写 token）：本 workflow 大多数 job 仅需
# checkout 读源码。build-and-test 只 build+test；image-pin-pr 用独立 GitHub App token（非
# GITHUB_TOKEN）跨 org 开 PR 到 k3s，且用 https git ls-remote 查 tip，均不需 GITHUB_TOKEN 写权限。
# deploy job 需 id-token: write 做 cosign keyless 签名，在该 job 内单独提权覆盖此默认。
permissions:
  contents: read

# build-push-action 每次上传的 *.dockerbuild 构建记录制品对部署无用，只占配额（ADR 0053 §9）。
env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  # ══ 复用探测（ADR 0053 §4/§5）══════════════════════════════════════════════
  # 不检出兄弟仓源码，几秒内算出构建复用键 key（aster-api commit + 7 个兄弟仓 tag commit + JDK），
  # 然后按优先级找可复用的产物：
  #   1. 镜像 wontlost/aster-api:build-<key> 存在且其 digest 带本 workflow 的 cosign 签名
  #      → 跳过 build&test 与镜像构建，按 digest 晋升（列车续跑 / 同 commit 重部署：~30min → ~2min）
  #   2. 制品 quarkus-app-<key> 存在（某次 build&test **通过后**才上传）
  #      → 跳过 build&test，用该制品构建镜像（deploy job 失败后的重跑）
  #   3. 都没有 → 照旧完整 build&test（向后兼容的缺省路径）
  # 任何探测失败（API 错误、签名不符、tag 不存在）都落到 3：复用只是加速，绝不放宽门禁。
  reuse-probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read      # 列出本仓 workflow 制品
    outputs:
      key: ${{ steps.key.outputs.key }}
      image_digest: ${{ steps.image.outputs.digest }}
      artifact_run: ${{ steps.artifact.outputs.run }}
    steps:
      - uses: actions/checkout@v7
      - name: 计算构建复用键
        id: key
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          API_SHA: ${{ github.sha }}
          MANIFEST_OUT: ${{ runner.temp }}/reuse-manifest.txt
        run: |
          set -euo pipefail
          KEY=$(bash scripts/ci/build-reuse-key.sh remote)
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          { echo "### 构建复用键 \`$KEY\`"; echo '```'; cat "$MANIFEST_OUT"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Install cosign
        if: ${{ !inputs.forceRebuild }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.5.2'   # 与 deploy job 同版本，理由见那里的注释
      - name: 探测可晋升镜像（build-<key> + 本 workflow 签名）
        id: image
        if: ${{ !inputs.forceRebuild }}
        env:
          KEY: ${{ steps.key.outputs.key }}
        run: |
          set -uo pipefail
          REF="docker.io/wontlost/aster-api:build-${KEY}"
          DIGEST=$(docker buildx imagetools inspect "$REF" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
          if [ -z "$DIGEST" ]; then echo "无 $REF → 不晋升"; exit 0; fi
          # fail-closed：只晋升由**本仓 deploy.yml@main** 签过的 digest（与 deploy job 的验签同一身份）。
          if cosign verify -a "build-key=${KEY}" "wontlost/aster-api@${DIGEST}" \
               --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/deploy\.yml@refs/heads/main$" \
               --certificate-oidc-issuer "https://token.actions.githubusercontent.com" >/dev/null 2>&1; then
            echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
            echo "♻️ 复用已签名镜像 \`$DIGEST\`（build-${KEY}）：跳过 build&test 与镜像构建" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::$REF 存在但 digest $DIGEST 验签失败 → 不晋升，完整重建"
          fi
      - name: 探测已验证的 quarkus-app 制品
        id: artifact
        if: ${{ !inputs.forceRebuild && steps.image.outputs.digest == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.key.outputs.key }}
        run: |
          set -uo pipefail
          RUN=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/artifacts" -f name="quarkus-app-${KEY}" -f per_page=10 \
                  -q '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .workflow_run.id // empty' 2>/dev/null || true)
          # ★来源校验（review H1）：制品名谁都能起，只信本仓 main 上 deploy.yml 的 push/dispatch run。
          if [ -n "$RUN" ] && ! gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$RUN" | REPO="$GITHUB_REPOSITORY" bash scripts/ci/verify-artifact-run.sh; then
            echo "::warning::quarkus-app-${KEY} 来自不可信 run $RUN → 不复用，完整 build&test"
            RUN=""
          fi
          if [ -n "$RUN" ]; then
            echo "run=$RUN" >> "$GITHUB_OUTPUT"
            echo "♻️ 复用 run $RUN 的 quarkus-app-${KEY}（该 run 的 build&test 已通过）：跳过 build&test" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "无 quarkus-app-${KEY} → 完整 build&test"
          fi

  build-and-test:
    needs: reuse-probe
    # 有可复用产物时跳过（见 reuse-probe）；deploy 对 skipped 放行。
    if: ${{ needs.reuse-probe.outputs.image_digest == '' && needs.reuse-probe.outputs.artifact_run == '' }}
    runs-on: ubuntu-latest
    # 真实 PostgreSQL service（固定 localhost:5432）。`./gradlew build` 含需 DB 的
    # @QuarkusTest 测试，它们连 application.properties 默认 localhost:5432；
    # PostgresTestResource 的 testcontainer 端口注入对这些测试不可靠。与 ci.yml 一致。
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aster_policy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_JDBC_URL: "jdbc:postgresql://localhost:5432/aster_policy"
      DB_REACTIVE_URL: "postgresql://localhost:5432/aster_policy"
      DB_USERNAME: "postgres"
      DB_PASSWORD: "postgres"
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          path: aster-api

      # ★必须在 setup-aster-build **之前**跑：该 action 按 sibling-ref checkout 兄弟仓
      #   源码并 publishToMavenLocal。若它与 settings.gradle 的 catalog 版本不一致，
      #   mavenLocal 里放的就是错版本，直到 Build & Test 才报
      #   `Could not find aster-lang-platform:X`——而那时 release train 已经把前面
      #   12 个制品全发出去了（1.0.29 实测）。在此拦住，失败得早、代价小。
      - name: 兄弟仓 ref 与 catalog 版本一致性（含反向自检）
        working-directory: aster-api
        run: |
          ./scripts/ci/verify-sibling-ref-pin.sh --self-test
          ./scripts/ci/verify-sibling-ref-pin.sh

      - name: Create aster_test database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE aster_test;" || true

      - name: Setup Aster build (siblings + JDK + version catalog)
        uses: ./aster-api/.github/actions/setup-aster-build
        with:
          cross-repo-token: ${{ secrets.CROSS_REPO_TOKEN }}
          # 部署链路 fail-closed：凭据缺失即失败，不静默回退 github.token。
          require-cross-repo-token: "true"

      # 恢复完整 build（含 integrationTest）：之前排除 IT 是因 MixpanelClientIT /
      # PlanGateServiceIT 的 mock 端口跨 classloader 不一致导致 flaky；该根因已修
      # （System property 缓存端口）+ 上面加了 redis service，IT 现已稳定，可重新
      # 作为生产部署的完整把关。
      # 完整性（ADR 0053 §8）：实际检出的兄弟仓源码必须就是 reuse-probe 的 key 所声明的那份
      # （tag 在两步之间被移动 / checkout 取错 ref → 不一致 → 失败），否则产物会以错误的 key 上传、被错误复用。
      - name: 断言检出源码与复用键一致
        working-directory: aster-api
        env:
          API_SHA: ${{ github.sha }}
          SIBLINGS_ROOT: ..
          WANT: ${{ needs.reuse-probe.outputs.key }}
        run: |
          GOT=$(bash scripts/ci/build-reuse-key.sh local)
          [ "$GOT" = "$WANT" ] || { echo "::error::检出源码的 key=$GOT ≠ reuse-probe 的 key=$WANT（兄弟仓 tag 在构建期间被移动？）"; exit 1; }
          echo "key=$GOT ✓"

      - name: Build & Test
        working-directory: aster-api
        run: ./gradlew build -Dquarkus.package.jar.type=fast-jar

      # 校验和随制品一起上传，下载方（本 run 或日后复用它的 run）逐文件校验。
      - name: Checksum build output
        working-directory: aster-api/build/quarkus-app
        run: find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      # 制品名带 key：只有 build&test **通过**才走到这里，故 quarkus-app-<key> 的存在即「已验证」。
      # retention 3 天兜底（ADR 0053 §9）；部署闭环成功后由 cleanup-build-artifact 立即删除
      # （此后复用走已签名镜像 build-<key>），失败则保留供重跑复用。
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: quarkus-app-${{ needs.reuse-probe.outputs.key }}
          path: aster-api/build/quarkus-app/
          retention-days: 3

  deploy:
    needs: [reuse-probe, build-and-test]
    # build-and-test 因复用而 skipped 时照常部署；它失败/取消则不部署。
    if: ${{ !cancelled() && needs.reuse-probe.result == 'success' && (needs.build-and-test.result == 'success' || needs.build-and-test.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      # 红队 P2-G：cosign keyless 签名需要 OIDC token（把签名绑定到本 CI 的
      # GitHub Actions 身份 = repo+workflow）。攻击者即便攻破 DockerHub 推入
      # 投毒镜像，也无法在没有本 CI OIDC 身份的情况下产出通过校验的签名。
      id-token: write
      contents: read
      actions: read      # 跨 run 下载可复用的 quarkus-app-<key>
    # digest-pin Phase 2：把已验签 digest + 是否过时 暴露给下游 image-pin-pr job。
    outputs:
      digest: ${{ steps.build.outputs.digest || needs.reuse-probe.outputs.image_digest }}
      stale: ${{ steps.staleguard.outputs.stale }}
    env:
      KEY: ${{ needs.reuse-probe.outputs.key }}
      # 非空 = 晋升已签名镜像：跳过下载 / 构建 / arch 校验 / 签名，只改 tag + 验签。
      PROMOTE_DIGEST: ${{ needs.reuse-probe.outputs.image_digest }}
    steps:
      - uses: actions/checkout@v7

      # Stale-commit guard（Codex 交叉审两轮定稿）：部署是不可逆动作（push 镜像 + rollout），
      # 且 deploy 的 concurrency 不 cancel 正在跑的 run。若 build-and-test 期间 main 又前进了，
      # 本次携带的已是过时提交——继续部署会把旧代码推上生产、覆盖更新的部署。
      #
      # 关键设计（吸取第一轮并行 stale-check 的教训）：guard 必须在**push 镜像的紧前一刻**取
      # 远端 tip，而不能用 workflow 开头的快照——否则 build 期间 main 前进就漏判。用 git
      # ls-remote 直接问远端（不依赖本地 refs/remotes 是否被 fetch 刷新，最可靠）。
      # 仅 push 事件把关；workflow_dispatch 手动部署允许部署任意点。
      - name: Stale-commit guard (skip push+deploy if main moved ahead)
        id: staleguard
        env:
          # gh api 需要 GH_TOKEN；本 job 的 permissions 已是 contents: read
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "非 push 事件（${{ github.event_name }}），跳过 stale 闸门。"
            echo "stale=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          REMOTE_TIP=$(git ls-remote origin refs/heads/main | cut -f1)
          echo "this run sha:    ${GITHUB_SHA}"
          echo "origin/main tip: ${REMOTE_TIP}"
          if [ -z "${REMOTE_TIP}" ]; then
            echo "::error::无法解析 origin/main tip（git ls-remote 返回空）——为安全起见按过时处理，不部署。"
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "⚠️ **部署已跳过**：无法解析 origin/main tip，按过时处理（fail-safe）。" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${GITHUB_SHA}" != "${REMOTE_TIP}" ]; then
            echo "::warning::main 已前进到 ${REMOTE_TIP}，本次 ${GITHUB_SHA} 已过时——跳过 push+部署，交由更新的 run 处理。"
            echo "stale=true" >> "$GITHUB_OUTPUT"
            # 运维可观测性：job 会显示成功但实际未部署，在 summary 里显式说明原因（Codex 审 Low）。
            echo "⏭️ **部署已跳过（过时提交）**：本次 \`${GITHUB_SHA}\` 已非 main tip（现为 \`${REMOTE_TIP}\`），由更新的 deploy run 接手。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      # 两 job 之间不互信：下载前再校验一次来源 run（review H1）。本 run 自产的制品同样过这道门。
      - name: Verify artifact source run
        if: ${{ steps.staleguard.outputs.stale != 'true' && env.PROMOTE_DIGEST == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SRC_RUN: ${{ needs.reuse-probe.outputs.artifact_run || github.run_id }}
        run: gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SRC_RUN}" | REPO="$GITHUB_REPOSITORY" bash scripts/ci/verify-artifact-run.sh

      - name: Download build artifact
        if: ${{ steps.staleguard.outputs.stale != 'true' && env.PROMOTE_DIGEST == '' }}
        uses: actions/download-artifact@v8
        with:
          name: quarkus-app-${{ needs.reuse-probe.outputs.key }}
          path: build/quarkus-app/
          # 复用时从产出它的那次 run 下载；否则就是本 run。
          run-id: ${{ needs.reuse-probe.outputs.artifact_run || github.run_id }}
          github-token: ${{ github.token }}

      - name: Verify build artifact checksums
        if: ${{ steps.staleguard.outputs.stale != 'true' && env.PROMOTE_DIGEST == '' }}
        working-directory: build/quarkus-app
        run: |
          test -s SHA256SUMS || { echo "::error::制品缺 SHA256SUMS（非本 workflow 产出？）"; exit 1; }
          sha256sum --quiet -c SHA256SUMS
          rm SHA256SUMS   # 不进镜像
          echo "quarkus-app-${KEY} 校验通过（来源 run ${{ needs.reuse-probe.outputs.artifact_run || github.run_id }}）"

      - if: ${{ steps.staleguard.outputs.stale != 'true' && env.PROMOTE_DIGEST == '' }}
        uses: docker/setup-qemu-action@v4

      # buildx 两条路径都要：晋升用 `buildx imagetools create`。
      - if: ${{ steps.staleguard.outputs.stale != 'true' }}
        uses: docker/setup-buildx-action@v4

      - if: ${{ steps.staleguard.outputs.stale != 'true' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate image tag
        id: meta
        if: ${{ steps.staleguard.outputs.stale != 'true' }}
        run: |
          SHA=$(echo "${{ github.sha }}" | head -c 7)
          TAG="${SHA}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Image tag: ${TAG}"

      - name: Build & Push Docker Image
        id: build
        if: ${{ steps.staleguard.outputs.stale != 'true' && env.PROMOTE_DIGEST == '' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.jvm
          platforms: linux/arm64
          # ★运行时构建标识（S0 / m1.5 层1）：把产出该镜像的 github.sha 烘进镜像 ENV ASTER_RUNTIME_BUILD
          # → toolchainId 的 build= 段变真值（原 dev）。值与镜像同源、不 drift；不碰 k3s/image-pin/bot 边界。
          build-args: |
            ASTER_RUNTIME_BUILD=${{ github.sha }}
          push: true
          # pull:true 每次重拉 base，避免复用过期/错误架构的 base 解析结果（Codex 建议）。
          pull: true
          # provenance:false 去掉 build-push-action 默认加的 provenance attestation manifest
          # （platform=unknown/unknown 条目）。某些 containerd/k3s 版本会误选它 exec，且单平台
          # 镜像不需要 attestation 索引；去掉让 manifest 干净、诊断不被 unknown 条目干扰。
          # ★注意：provenance:false 只清 manifest，**不保证 rootfs 是 arm64**——真正的架构约束
          # 来自 Dockerfile 构建期 `RUN uname -m` 断言 + 下面 push 后 verifier（Codex 复审）。
          provenance: false
          sbom: false
          # build-<key>：复用键 tag，日后同 key 的部署按 digest 晋升它而不重建（ADR 0053 §5）。
          tags: |
            wontlost/aster-api:${{ steps.meta.outputs.tag }}
            wontlost/aster-api:jvm-latest
            wontlost/aster-api:build-${{ env.KEY }}

      # 晋升（ADR 0053 §5）：build once, promote by digest——把已签名 digest 重新打上本次的
      # <sha7> / jvm-latest tag。只改 registry 指针，不产生新 digest，签名（绑 digest）依然有效。
      - name: Promote signed image by digest
        if: ${{ steps.staleguard.outputs.stale != 'true' && env.PROMOTE_DIGEST != '' }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "wontlost/aster-api:${{ steps.meta.outputs.tag }}" \
            -t wontlost/aster-api:jvm-latest \
            "wontlost/aster-api@${PROMOTE_DIGEST}"
          echo "♻️ 晋升 \`${PROMOTE_DIGEST}\` → ${{ steps.meta.outputs.tag }}, jvm-latest（未重建）" >> "$GITHUB_STEP_SUMMARY"

      # ★arm64 内容校验（2026-07-15 加）：集群节点是 ARM64（VM.Standard.A1.Flex Ampere），
      # 但曾发生 build-push-action + QEMU 产出**内容是 amd64 却标 arm64** 的镜像 → 节点
      # `exec /bin/sh: exec format error` → CrashLoopBackOff → rollout 卡「progress deadline」。
      # manifest 的 architecture 字段会撒谎（标 arm64），故拉真实 arm64 变体在其内 `uname -m`
      # 必须 aarch64，否则**构建即失败**，杜绝 mislabeled 镜像上生产（补上 pipeline 缺的 arch verifier）。
      - name: Verify pushed image is genuinely arm64
        if: ${{ steps.staleguard.outputs.stale != 'true' && env.PROMOTE_DIGEST == '' }}
        run: |
          set -euo pipefail
          DIGEST='${{ steps.build.outputs.digest }}'
          # ★先静默 pull，避免 docker run 的 "Pulling from ..." 进度污染 uname 输出捕获
          # （之前 2>&1 把 pull 进度混进 $PRE 导致误判 preflight 失败）。pull 出 stdout 丢弃。
          docker pull -q --platform linux/arm64 alpine:latest >/dev/null 2>&1 || true
          docker pull -q --platform linux/arm64 "wontlost/aster-api@${DIGEST}" >/dev/null 2>&1 || true
          # arch 捕获：只取 uname 的 **stdout 最后一行**（2>/dev/null 丢 stderr，tail -n1 防残留）。
          runcmd() { docker run --rm --platform linux/arm64 "$1" sh -c 'uname -m' 2>/dev/null | tail -n1 | tr -d '[:space:]'; }
          # preflight：runner 的 QEMU/binfmt 能否模拟 arm64（否则真 arm64 镜像也跑不起来，
          # 会误判成镜像坏）。preflight 失败=CI 环境问题（binfmt 未注册），非镜像 arch 问题。
          PRE="$(runcmd alpine:latest || true)"
          case "$PRE" in
            aarch64|arm64) echo "preflight OK: runner 可模拟 arm64 ($PRE)" ;;
            *) echo "::error title=qemu preflight failed::runner QEMU/binfmt 未能模拟 arm64（alpine uname='$PRE'）。CI 环境问题非镜像问题。"; exit 1 ;;
          esac
          echo "Verifying wontlost/aster-api@${DIGEST} is real arm64…"
          ARCH="$(runcmd "wontlost/aster-api@${DIGEST}" || true)"
          echo "in-image uname -m = '${ARCH}'"
          case "${ARCH}" in
            aarch64|arm64) echo "✓ genuine arm64" ;;
            *) echo "::error title=arch mismatch::pushed image 标 arm64 但内容是 '${ARCH}'（非 aarch64）。QEMU 跨构建产出 mislabeled 镜像，禁止上生产。"; exit 1 ;;
          esac

      # 红队 P2-G：sign / verify 均对 build-push-action 输出的**不可变 digest** 做（非浮动
      # tag），把签名身份绑定到本 workflow 的 OIDC。这消除了 verify 阶段的 signed-rollback：
      # 只签验"本次刚构建"的 digest，历史 digest 不进入验签。
      #
      # ⚠️ 已知遗留（TOCTOU，本轮不修，Codex 交叉审确认）：verify 对 digest 成立，但最终
      # 下面的 `rollout restart` 让集群按 **浮动 tag jvm-latest** 重新拉取（因 ArgoCD 对账把
      # image 字段还原成 git manifest 的 jvm-latest，`set image @digest` 会被立即回滚——见
      # Deploy 步骤注释）。故 verify(digest) 与 pull(jvm-latest) 之间存在窗口：tag 可被替换，
      # 或指向历史签过的 digest。真正闭合需 GitOps 侧按 digest pin（把 @sha256 写进 ArgoCD
      # git 源）或集群 admission 按签名校验——那是部署模型变更，应单独立项，不在本次 workflow
      # 优化范围内。当前注释如实描述现状，不再声称"全链 by-digest"。
      - name: Install cosign
        if: ${{ steps.staleguard.outputs.stale != 'true' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # ★必须显式 pin cosign 版本，不能只 pin installer。
          #   installer 从 @v3 升到 v4.1.2 时，其**默认 cosign-release 由 v2.5.2
          #   变成 v3.0.6**，而 cosign v3 把 `--new-bundle-format` 设为默认：
          #   签名改存为 OCI 1.1 referring artifact，旧路径找不到 → `no signatures found`
          #   （2026-08-01 实测：三个 deploy workflow 同时开始失败，exit code 10）。
          #   生产验签方是 policy-controller，其内置 cosign 版本未知，且已部署镜像
          #   全部是 v2 attached 格式——贸然切 v3 可能让**准入拒绝所有新镜像**，
          #   比 CI 红严重得多。故固定回已验证可用的 v2.5.2。
          #   升级到 v3 需要单独评估：先确认 policy-controller 支持新 bundle 格式。
          cosign-release: 'v2.5.2'

      - name: Sign pushed image digest (keyless)
        if: ${{ steps.staleguard.outputs.stale != 'true' && env.PROMOTE_DIGEST == '' }}
        env:
          COSIGN_YES: "true"
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "${DIGEST}" || { echo "build 未输出 digest，中止"; exit 1; }
          # signer 身份 = 本 CI 的 OIDC（Fulcio 证书 + Rekor 透明日志）。
          # build-key 注解把复用键绑进签名（review M1）：晋升时按 -a build-key=<key> 验签，
          # 防止 build-<key> tag 被改指向一个「签过名但属于别的 key」的旧 digest。
          cosign sign -a "build-key=${KEY}" "wontlost/aster-api@${DIGEST}"
          echo "signed digest=${DIGEST}"

      # 部署前校验**本次刚构建的 digest**（非浮动 tag）带一份由本仓库本 workflow 签发的
      # cosign 签名。fail-closed：任何签名/身份不符 → verify 失败 → 部署中止。
      # 晋升路径同样在此 fail-closed 验签（reuse-probe 已验过一次，部署前再验——两 job 之间不可信）。
      - name: Verify freshly-built digest signature
        if: ${{ steps.staleguard.outputs.stale != 'true' }}
        env:
          DIGEST: ${{ steps.build.outputs.digest || env.PROMOTE_DIGEST }}
        run: |
          cosign verify -a "build-key=${KEY}" "wontlost/aster-api@${DIGEST}" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/deploy\.yml@refs/heads/main$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      # ── Phase 3 P3-2a：已移除 `Deploy to K3S`（kubectl rollout restart）发布语义 ──
      # 统一 digest pin 全链上线后，发布真相 = image-pin-pr job 开 PR 改 k3s image-lock +
      # kustomization digest → verify-image-pin 验签通过后脚本合并 → ArgoCD by-digest sync →
      # 滚动更新。旧的 rollout restart 在 P3-0（kustomize 渲染 @digest）后已**不再是有效发布
      # 通道**（deployment.spec 已是 @digest，restart 只重启当前 digest、不部署新 tag），故删除。
      #
      # ⚠️ 本 job（build+sign+verify）**不再直接部署**——它只产出已验签 digest 供下游 image-pin-pr
      # 使用。若 image-pin-pr 失败 = 新版本不上线（fail-closed，可见：该 job 会红）。
      # 回滚：git revert 本 commit 恢复 rollout restart（但注意：需配合 ArgoCD 侧才能真回旧 tag 发布）。

  # ── 统一 digest pin 设计 A′ Phase 2：CI 开 PR 到 k3s 改 image-lock ──────────────
  # 见 wontlost-ltd/k3s#4、k3s .github/image-pin/。独立 job：fail-loud 但**不阻塞**上面
  # 既有 rollout 发布路径（Phase 2 期间两条路径并存，Phase 3 再移除 rollout 发布语义）。
  # ⚠️ 暂态（如实标注）：image-lock PR 合并后 ArgoCD 按 digest sync 一次 + 上面 rollout 一次
  # ＝同一 digest 可能多一次滚动更新，结果一致（幂等），非安全冲突。
  #
  # 前置（人工，见 k3s SETUP.md）：本仓需配 vars.IMAGE_PIN_APP_CLIENT_ID +
  # secrets.IMAGE_PIN_APP_PRIVATE_KEY（image-pin App id 4253193 的私钥）。未配置则本 job skip，
  # 而该 pin 时 pin-closure-guard 会因此失败。门控与 mint token 用同一个变量（#343），
  # 与 aster-replay-runner-deploy / aster-runner-launcher-deploy 一致。
  # ★「该 pin」的判定（与下面 pin-closure-guard 共用同一套语义，改一处必改两处）：
  #   push 到 main            → 该 pin（原有行为）
  #   带 trainId 的 dispatch  → 该 pin（发版列车，platform#82 前它被静默跳过）
  #   手工无参 dispatch        → 不该 pin（调试/重跑，保持 skip 且不判失败）
  #
  #   另两个条件是**真实的不该 pin**，非缺陷：
  #   - stale == 'true'：github.sha 已不是 origin/main tip，开 PR 会 pin 旧 digest
  #   - IMAGE_PIN_APP_CLIENT_ID == ''：未配 App 凭据（见 k3s SETUP.md），开不出 PR
  image-pin-pr:
    needs: deploy
    # ★两侧显式加括号：GitHub 表达式里 && 确实比 || 紧，但靠优先级读代码容易被后人误改。
    if: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main')
             || (github.event_name == 'workflow_dispatch' && inputs.trainId != ''))
            && needs.deploy.outputs.stale != 'true' && vars.IMAGE_PIN_APP_CLIENT_ID != '' }}
    runs-on: ubuntu-latest
    # ★步骤可以被 if: 静默跳过而 job 仍是 success（Final stale gate 判过时即如此），
    #   所以把「PR 是否真的开出」作为输出交给 pin-closure-guard，而不是让它只看 job 结论（#341）。
    outputs:
      pinned: ${{ steps.openpr.outcome == 'success' }}
      final_stale: ${{ steps.stalegate.outputs.skip }}
    concurrency:
      group: image-pin-pr-aster-api        # per-image：不与 aster-cloud 的 job 互相取消
      cancel-in-progress: true
    steps:
      - name: Final stale gate (再确认 github.sha 仍是 origin/main tip)
        env:
          # gh api 需要 GH_TOKEN；本 job 的 permissions 已是 contents: read
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 减少 k3s 端 freshness fail-closed 噪音：开 PR 前再查一次，已过时则不开（下次 push 重建）。
          # ★转私后必须带凭据：匿名 `git ls-remote https://github.com/...` 在私有仓上
          #   会提示输入用户名 → `fatal: could not read Username` → exit 128
          #   （2026-08-02 实测：aster-api 转私后三个 deploy workflow 全中）。
          #   改用 gh api（本 job 已有 contents: read 的 GITHUB_TOKEN），
          #   顺带避免把 token 写进 URL（不出现在进程列表/git 配置里）。
          tip="$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)"
          echo "this run: ${GITHUB_SHA}  origin/main tip: ${tip}"
          if [ "${GITHUB_SHA}" != "${tip}" ]; then
            echo "::notice::main 已前进，本 run 过时 → 跳过 image-pin PR（下次 push 重建固定分支）"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
        id: stalegate

      - name: Mint k3s-scoped token (跨 org：App 装在 wontlost-ltd/k3s)
        if: ${{ steps.stalegate.outputs.skip != 'true' }}
        id: k3stoken
        uses: actions/create-github-app-token@v3.3.0
        with:
          # client-id 取代已弃用的 app-id（create-github-app-token@v3 弃用警告）。
          client-id: ${{ vars.IMAGE_PIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.IMAGE_PIN_APP_PRIVATE_KEY }}
          owner: wontlost-ltd
          repositories: k3s
          permission-contents: write
          permission-pull-requests: write
          # 读 k3s 上 verify-image-pin 的结果：脚本等验签通过后才合并（aster-cloud#506）。
          permission-checks: read

      # checkout 本仓以取用共享脚本（image-pin-pr 是独立 job，需自己 checkout）。
      - name: Checkout (for shared script)
        if: ${{ steps.stalegate.outputs.skip != 'true' }}
        uses: actions/checkout@v7

      - name: Open/update image-pin PR to k3s
        id: openpr
        if: ${{ steps.stalegate.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ steps.k3stoken.outputs.token }}
          DIGEST: ${{ needs.deploy.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          bash scripts/ci/open-image-pin-pr.sh \
            docker.io/wontlost/aster-api image-pin/aster-api

  # ══ 部署闭环自检：该 pin 而没 pin ⇒ 显式失败 ═══════════════════════════════
  #
  # ★为什么必须有这一道（platform#82）：
  #   image-pin-pr 的 `if:` 为假时 GitHub 把它记为 **skipped**，而 skipped 不会让
  #   workflow 变红。1.0.29 实测：列车 dispatch 的那次部署 build-and-test/deploy 全绿、
  #   image-pin-pr 静默 skipped，集群因此**根本没换版本**，列车那头只看到一个「超时」。
  #   三个信号拼在一起，看起来像「只是慢了点」。
  #
  #   条件放宽（上面那个 if）只是让列车能走到 pin；它本身**不会在回归时变红**——
  #   若将来有人改坏那个条件，pin 又会静默消失。故这里用一道独立的、
  #   **不共享那个条件**的自检来兜底：只要「本次该 pin」，就要求 pin 真的跑成功了。
  #
  # if: always() —— 必须，否则 image-pin-pr 被 skip 时本 job 也跟着 skip，白守。
  pin-closure-guard:
    needs: [deploy, image-pin-pr]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # 判定逻辑在脚本里，有表驱动测试（scripts/ci/pin-closure-guard.test.sh，ci-build 里跑）
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci
      - name: 断言「该 pin 则已 pin」
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          TRAIN_ID: ${{ inputs.trainId }}
          STALE: ${{ needs.deploy.outputs.stale }}
          CLIENT_ID: ${{ vars.IMAGE_PIN_APP_CLIENT_ID }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PIN_RESULT: ${{ needs.image-pin-pr.result }}
          PINNED: ${{ needs.image-pin-pr.outputs.pinned }}
          FINAL_STALE: ${{ needs.image-pin-pr.outputs.final_stale }}
        run: bash scripts/ci/pin-closure-guard.sh

  # ══ 清理（ADR 0053 §9）══════════════════════════════════════════════════════
  # 部署闭环成功（pin-closure-guard 绿）后，quarkus-app-<key>（~114MB/个）已无用：镜像已按 digest
  # 推送签名，同 key 的复用改走 build-<key> 镜像。立即删除，不等 retention。
  # 闭环失败则保留（重跑时 reuse-probe 复用它，省 ~28min build&test），retention 3 天到期自动回收。
  # 清理失败只告警，不让一次成功的部署变红。
  cleanup-build-artifact:
    needs: [reuse-probe, deploy, pin-closure-guard]
    if: ${{ !cancelled() && needs.pin-closure-guard.result == 'success' && needs.deploy.result == 'success' && needs.deploy.outputs.stale != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete quarkus-app-<key> artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ needs.reuse-probe.outputs.key }}
        run: |
          set -uo pipefail
          ids=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/artifacts" -f name="quarkus-app-${KEY}" -f per_page=100 \
                  -q '.artifacts[].id' 2>/dev/null || true)
          [ -n "$ids" ] || { echo "无 quarkus-app-${KEY} 可删"; exit 0; }
          for id in $ids; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id" \
              && echo "deleted artifact $id" \
              || echo "::warning::删除制品 $id 失败——retention 到期自动回收"
          done
